name: eventos
description: "Sistema de Gestión de Eventos UPEU"
version: 1.0.0+20

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_functions: ^5.1.3
  firebase_storage: ^12.0.0
  http: ^1.2.0
  cloud_firestore: ^5.5.2
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  file_picker: ^8.1.2
  excel: ^4.0.3
  app_links: ^7.0.0
  device_info_plus: ^11.5.0
  path_provider: ^2.1.1
  open_filex: ^4.3.4
  permission_handler: ^11.1.0
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^10.1.4
  uuid: ^4.0.0
  provider: ^6.1.5+1
  archive: ^3.6.1
  firebase_app_check: ^0.3.2+10
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.9

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/eventsci_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/eventsci_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/eventsci_logo.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/eventsci_logo.png
    icon_background_color: "#FFFFFF"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/plantilla_informe.docx
    - assets/plantilla_certificado.png

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic

    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
    - family: GreatVibes  
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf